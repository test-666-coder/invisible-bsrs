[project]
name = "patient-mood-thermometer"
version = "0.2.0"
description = "Local speech pipeline plus OpenAI structured BSRS JSON output."
requires-python = ">=3.10"
dependencies = [
  "openai>=1.80.0",
  "transformers>=4.45.0",
  "huggingface_hub>=0.24.0",
  "torch>=2.3.0",
  "torchaudio>=2.3.0",
  "soundfile>=0.12.1",
  "librosa>=0.10.2",
  "python-dotenv>=1.0.1",
  "sentencepiece>=0.2.0",
]

[project.scripts]
patient-mood-pipeline = "patient_mood_pipeline.run:main"
